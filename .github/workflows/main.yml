name: OmniRoute-VPS
on:
  workflow_dispatch:

jobs:
  omniroute-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=omniroute
          TSIP=$(tailscale ip -4 | head -n 1)
          echo "TAILSCALE_IP=$TSIP" >> $GITHUB_ENV
          echo "✅ Tailscale IP: $TSIP"

      - name: Run OmniRoute Container
        run: |
          docker run -d \
            --name omniroute \
            --restart unless-stopped \
            -p 20128:20128 \
            -v omniroute-data:/app/data \
            diegosouzapw/omniroute:latest

      - name: Show Access Info
        run: |
          echo "✅ OmniRoute is running!"
          echo "🌐 رابط الدخول: http://${{ env.TAILSCALE_IP }}:20128"

      - name: Keep Server Alive
        run: |
          while true; do
            echo "[$(date)] OmniRoute running..."
            sleep 300
          done
